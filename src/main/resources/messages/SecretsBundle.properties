settings.envspec.decorators=Apply env-spec decorators of .env files at launch
settings.envspec.decorators.comment=@required, @optional, @sensitive, @public, @internal, @type and the header's @defaultRequired / @defaultSensitive. Only files that use them are affected: a required variable without a value stops the launch, sensitive values are masked in the console, internal ones are not passed to the process, type mismatches are reported.
settings.envspec.layered=Layered .env files
settings.envspec.layered.comment=Launches read .env.schema, .env, .env.local, .env.[environment] and .env.[environment].local (later ones win) from the program's directory and next to an attached .env, where [environment] is the launch's environment, and pass all their variables to the process.
settings.varlock=varlock compatibility mode
settings.varlock.comment=Editor support for varlock's .env.schema and the .env files layered with it, in directories with a .env.schema or files using decorators: highlighting, completion, varlock-specific checks, documentation on hover and navigation. Nothing in these files is ever run from the IDE.
