Reports a plaintext value in <code>appsettings*.json</code> for a setting that an Infisical secret provides
(<code>ConnectionStrings:Default</code> ⇄ <code>ConnectionStrings__Default</code>). At run time the secret overrides the value
anyway, and a committed file is no place for a secret. The quick fix clears the value.
